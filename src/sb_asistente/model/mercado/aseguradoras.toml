# Registro de aseguradoras del corpus de mercado (SPEC-069).
#
# Sumar una aseguradora = agregar un bloque [[aseguradora]] y correr `make mercado`.
# - id: minúsculas y guiones; es la llave en Gold (`aseguradora`) y en la API.
# - sitio: dominio público (https). El scraping respeta su robots.txt y usa su sitemap.
# - prefijo: opcional; solo rutas que empiezan así (sitios regionales, p. ej. /colombia).
# - alias: cómo la nombra la gente (para que el clasificador la detecte en un mensaje). Evite
#   palabras comunes solas («positiva», «estado», «aurora», «bmi», «liberty»): darían falsos positivos.
# - verificado: true cuando `sb mercado verificar` confirmó robots.txt y sitemap.
# - activo: false la deja en el registro (el clasificador la reconoce) sin hacer scraping.
# - corpus_propio: su corpus sale del pipeline principal (`make data`), no de este registro.
# Solo información pública; nunca datos de clientes (Ley 1581).

[[aseguradora]]
id = "seguros-bolivar"
nombre = "Seguros Bolívar"
sitio = "https://www.segurosbolivar.com"
alias = ["bolivar", "seguros bolivar"]
verificado = true
corpus_propio = true

