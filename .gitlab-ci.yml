# Pipeline de GitLab · Gestión de Proyectos, Módulo 4 (SPEC-074, ADR-033).
#
# GitHub es el repositorio principal (PR, revisión cruzada, Kanban). Cada push a `develop` o
# `main` llega aquí por el espejo (.github/workflows/espejo-gitlab.yml) y GitLab corre este
# pipeline. Parte 1: lint + test + detección de secretos (SPEC-074). Parte 2: build de las imágenes,
# push al Container Registry y deploy por SSH al Droplet con Caddy y HTTPS (SPEC-075, ADR-034).
#
# Variables de CI (Settings → CI/CD → Variables; ninguna va en el repositorio):
#   SSH_KEY          File, protegida  · llave privada del usuario `deploy` del Droplet
#   SSH_KNOWN_HOSTS  protegida        · salida de `ssh-keyscan -t ed25519 <IP>`
#   ENV_PRODUCCION   File, protegida  · .env de producción (plantilla: deploy/app.env.example)
#   DEPLOY_HOST      IP del Droplet  · DEPLOY_USER `deploy` · DOMINIO <ip-con-guiones>.sslip.io
# Yellowdata (SPEC-076) se publica desde su propio proyecto (daalrasi/yellowdata); este deploy
# descarga su :latest, por eso ese proyecto debe permitir el CI_JOB_TOKEN de advanced-ai-lab.
# El Registry usa CI_REGISTRY_USER / CI_REGISTRY_PASSWORD / CI_JOB_TOKEN, que GitLab crea por job.

stages:
  - lint
  - test
  - build
  - deploy

include:
  # Plantilla gratuita de GitLab: busca llaves, tokens y contraseñas en el código (rúbrica: secretos).
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"  # «Run pipeline» desde la interfaz

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never  # la imagen ya trae Python 3.13

default:
  interruptible: true

# Panel en vivo de Yellowdata (SPEC-082): cada job avisa su resultado al grafo de /casos. Opcional:
# sin las variables de CI enmascaradas AGENT_EVENTS_URL y AGENT_EVENTS_TOKEN no hace nada. El log
# muestra el nombre de la variable, nunca su valor, y un fallo del aviso no cambia el resultado del job.
.aviso_panel:
  after_script:
    - &aviso_panel |
      if [ -n "$AGENT_EVENTS_URL" ] && [ -n "$AGENT_EVENTS_TOKEN" ]; then
        OK=false; [ "$CI_JOB_STATUS" = "success" ] && OK=true
        export CUERPO="{\"evento\":\"CI\",\"agente\":\"gitlab-ci\",\"herramienta\":\"$CI_JOB_NAME\",\"rama\":\"$CI_COMMIT_REF_NAME\",\"comando\":\"$CI_PROJECT_NAME@$CI_COMMIT_SHORT_SHA\",\"ok\":$OK}"
        if command -v python3 >/dev/null 2>&1; then
          python3 -c 'import os, urllib.request as u; u.urlopen(u.Request(os.environ["AGENT_EVENTS_URL"], data=os.environ["CUERPO"].encode(), headers={"Authorization": "Bearer " + os.environ["AGENT_EVENTS_TOKEN"], "Content-Type": "application/json"}), timeout=10)' || true
        else
          command -v curl >/dev/null 2>&1 || apk add --no-cache -q curl >/dev/null 2>&1 || true
          curl -fsS -m 10 -o /dev/null -H "Authorization: Bearer $AGENT_EVENTS_TOKEN" -H "Content-Type: application/json" --data "$CUERPO" "$AGENT_EVENTS_URL" || true
        fi
      fi

# Base de los jobs de Python. No va en `default`: el job `secret_detection` de la plantilla
# usa su propia imagen (sin uv) y heredaría el `before_script`, fallando con «uv: not found».
.uv:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --frozen
  after_script:
    - *aviso_panel

lint:
  extends: .uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  extends: .uv
  stage: test
  # Sin red ni API: fixtures locales y LLM falso (no se gasta saldo de ninguna API).
  script:
    - >
      uv run pytest -q --cov --cov-report=term --cov-report=xml:coverage.xml
      --junitxml=report.xml --cov-fail-under=85
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ---------- Parte 2 · build y push al Container Registry (M4-02) ----------
.docker:
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - docker logout "$CI_REGISTRY"
    - *aviso_panel

build_api:
  extends: .docker
  stage: build
  script:
    - IMAGEN="$CI_REGISTRY_IMAGE/api"
    - docker build --pull -t "$IMAGEN:$CI_COMMIT_SHORT_SHA" -t "$IMAGEN:$CI_COMMIT_REF_SLUG" .
    - docker push "$IMAGEN:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGEN:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGEN:$CI_COMMIT_SHORT_SHA" "$IMAGEN:latest" && docker push "$IMAGEN:latest"
      fi

build_frontend:
  extends: .docker
  stage: build
  script:
    - test -n "$DOMINIO" || { echo "Falta la variable de CI DOMINIO"; exit 1; }
    - IMAGEN="$CI_REGISTRY_IMAGE/frontend"
    # Vite fija la URL de la API al compilar
    - >
      docker build --pull --build-arg VITE_API_URL="https://api.$DOMINIO"
      -t "$IMAGEN:$CI_COMMIT_SHORT_SHA" -t "$IMAGEN:$CI_COMMIT_REF_SLUG" frontend
    - docker push "$IMAGEN:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGEN:$CI_COMMIT_REF_SLUG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGEN:$CI_COMMIT_SHORT_SHA" "$IMAGEN:latest" && docker push "$IMAGEN:latest"
      fi

# ---------- Parte 2 · deploy por SSH al Droplet (M4-05) ----------
deploy:
  stage: deploy
  image: alpine:3.22
  interruptible: false
  resource_group: produccion  # nunca dos deploys a la vez
  environment:
    name: produccion
    url: https://$DOMINIO
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache openssh-client curl
    - install -m 700 -d ~/.ssh
    # SSH_KEY debe ser tipo File (GitLab pasa la ruta). Si se creó como Variable, se escribe su
    # contenido sin pasarlo como argumento a ningún comando (así nunca termina en el log).
    - |
      if [ -f "$SSH_KEY" ]; then cp "$SSH_KEY" ~/.ssh/id_ed25519; else printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519; fi
      chmod 600 ~/.ssh/id_ed25519
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - DESTINO="$DEPLOY_USER@$DEPLOY_HOST"
    - DIR=/opt/advanced-ai-lab
    - scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/desplegar.sh "$DESTINO:$DIR/"
    - test -f "$ENV_PRODUCCION" || { echo "ENV_PRODUCCION debe ser una variable tipo File"; exit 1; }
    - scp "$ENV_PRODUCCION" "$DESTINO:$DIR/app.env"
    # El token del Registry viaja por stdin; las imágenes llevan el tag del commit (trazable)
    - >
      printf '%s' "$CI_JOB_TOKEN" | ssh "$DESTINO"
      "cd $DIR && IMAGEN_API=$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHORT_SHA
      IMAGEN_FRONTEND=$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
      DOMINIO=$DOMINIO REGISTRO=$CI_REGISTRY sh desplegar.sh"
    # Verificación desde fuera: HTTPS válido y API respondiendo
    - curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "https://api.$DOMINIO/health"
    - curl --fail --silent --show-error --retry 5 --retry-delay 6 --retry-all-errors -o /dev/null "https://$DOMINIO/"
    - curl --fail --silent --show-error --retry 15 --retry-delay 6 --retry-all-errors -o /dev/null "https://app.$DOMINIO/"
  after_script:
    - rm -f ~/.ssh/id_ed25519
    - *aviso_panel
