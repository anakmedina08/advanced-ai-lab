# git-cliff: genera CHANGELOG.md desde Conventional Commits (make changelog)
[changelog]
header = "# Changelog\n\nTodos los cambios relevantes de este proyecto.\n"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Sin publicar]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Nuevas funcionalidades" },
  { message = "^fix", group = "Correcciones" },
  { message = "^perf", group = "Rendimiento" },
  { message = "^docs", group = "Documentación" },
  { message = "^refactor", group = "Refactorización" },
  { message = "^(ci|build)", group = "CI y build" },
  { message = "^(chore|style|test)", skip = true },
]
