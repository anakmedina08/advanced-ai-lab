# `pre-commit install` instala ambos ganchos: revisión de código y mensaje semántico.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Sin `exclude` global: gitleaks y detect-private-key revisan también .claude/ y tests/fixtures/.
# Solo los hooks de formato e higiene saltan las skills de terceros y los fixtures HTML.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        exclude: &terceros ^(\.claude/|tests/fixtures/)
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: *terceros
      - id: check-json
        exclude: *terceros
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        exclude: *terceros
      - id: end-of-file-fixer
        exclude: *terceros
      - id: trailing-whitespace
        exclude: *terceros
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Llaves de API, tokens y credenciales en lo que entra al commit (SPEC-053).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-data-and-secrets
        name: Bloquear datos, .env, configuración local, pesos y notebooks
        entry: data/, .env*, .claude/settings.local.json, pesos y notebooks no se versionan
        language: fail
        # Todo data/ salvo los .gitkeep; .env y sus variantes salvo .env.example (en cualquier carpeta).
        files: (^data/(?!.*\.gitkeep$)|(^|/)\.env(?!\.example$)(\.[^/]+)?$|^\.claude/settings\.local\.json$|\.(joblib|pt|h5|onnx|safetensors|ipynb)$)
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: *terceros
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: *terceros
      - id: uv-lock-check
        name: uv.lock sincronizado con pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      # Revisión semántica con IA contra AGENTS.md y CONSTITUTION.md (después de lo barato).
      - id: gga
        name: Gentleman Guardian Angel (AGENTS.md)
        entry: gga run
        language: system
        pass_filenames: false
        files: \.(py|toml|ya?ml)$|^Dockerfile$
      # Quita Co-Authored-By de asistentes de IA y Claude-Session antes de validar (SPEC-050, ADR-023).
      - id: limpiar-trailers-ia
        name: Sin coautor de IA en el mensaje
        entry: uv run python scripts/limpiar_trailers_ia.py
        language: system
        stages: [commit-msg]
      # Commits auditados con mensajes semánticos (evidencia pedida en cada entrega).
      - id: conventional-commit
        name: Conventional Commits
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
