[project]
name = "sb-asistente"
version = "0.1.0"
description = "Asistente de conocimiento de Seguros Bolívar: scraping Medallion + Q&A con LangChain (TAAML · UAO · Grupo 10)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Silva" },
    { name = "Katherine Medina" },
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
sb = "sb_asistente.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["sb_asistente"]
omit = ["src/sb_asistente/view/streamlit_app.py"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D", "ANN", "SIM", "BLE"]
ignore = ["D203", "D213", "D100", "D104", "D401", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["sb_asistente"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"src/sb_asistente/llm/prompts.py" = ["E501"]  # el texto del prompt es dato: no se parte
