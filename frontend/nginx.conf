# SPA: cualquier ruta del cliente (/foto, /estado) sirve index.html; la API sigue en su propio servicio.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
