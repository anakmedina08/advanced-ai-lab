version: 2

# Gitflow: las actualizaciones entran a develop (nunca directo a main) y se agrupan en un solo PR
# semanal por ecosistema para no llenar el tablero de PR sueltos.
updates:
  # Dependencias de Python / uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-menores:
        update-types: ["minor", "patch"]
      python-mayores:
        update-types: ["major"]
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"

  # Acciones de GitHub usadas en los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      acciones:
        patterns: ["*"]
    labels:
      - chore
      - infra
    commit-message:
      prefix: "chore"
