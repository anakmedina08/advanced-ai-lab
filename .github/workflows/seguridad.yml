name: Seguridad

# SPEC-053: escaneo de secretos. SPEC-054 suma auditoría de dependencias, CodeQL y SBOM.
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "17 6 * * 1"   # cada lunes, aunque no cambie el código
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historial completo
      - name: gitleaks sobre todo el historial
        env:
          VERSION: "8.30.1"   # la misma del hook de pre-commit
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archivo="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archivo}"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " ${archivo}$" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check --strict -
          tar xzf "${archivo}" gitleaks
          ./gitleaks git . --redact --log-opts="--all" --exit-code 1
