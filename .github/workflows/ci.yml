name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Ruff + Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Sin red ni API: fixtures HTML locales y LLM falso (no se gasta saldo de la API de Anthropic)
      - run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=85
