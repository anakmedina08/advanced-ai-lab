name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Ruff + Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Sin red ni API: fixtures HTML locales y LLM falso (no se gasta saldo de la API de Anthropic)
      - run: uv run pytest -v --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Build Docker multi-stage (CPU)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Construir la imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sb-asistente:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
