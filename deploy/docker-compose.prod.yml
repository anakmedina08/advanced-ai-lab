# Producción en el Droplet · Gestión, Módulo 4, Parte 2 (SPEC-075, ADR-034).
#
#   Internet ──443──▶ caddy ──▶ yellowdata:3000 (https://$DOMINIO)      sitio público (SPEC-076)
#                         ├──▶ frontend:80     (https://app.$DOMINIO)  panel del equipo
#                         └──▶ api:8000        (https://api.$DOMINIO)
#
# Solo Caddy publica puertos a internet (80 y 443); la API y el frontend quedan en la red interna.
# Excepción: la API se publica también en loopback (127.0.0.1:8000) para el MCP propio (SPEC-078),
# que el gateway de OpenClaw (network_mode: host) alcanza sin exponer nada a internet.
# Las imágenes vienen del Container Registry de GitLab con el tag del commit (trazable).
# El job `deploy` exporta IMAGEN_API, IMAGEN_FRONTEND y DOMINIO; los secretos van en app.env
# (variable de CI tipo archivo ENV_PRODUCCION), nunca en este archivo ni en el repositorio.
name: advanced-ai-lab

services:
  api:
    image: ${IMAGEN_API:?falta IMAGEN_API}
    restart: unless-stopped
    command: ["sb", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - app.env
    environment:
      FRONTEND_ORIGINS: "https://app.${DOMINIO:?falta DOMINIO},https://${DOMINIO}"
      SB_MLFLOW: "0"  # sin servidor MLflow en producción
    volumes:
      - ./data:/app/data  # datos públicos del corpus, subidos una vez con rsync
    expose:
      - "8000"
    # Solo loopback: el MCP propio (SPEC-078) se expone en /mcp para el gateway de OpenClaw,
    # que corre con `network_mode: host` y lo alcanza en 127.0.0.1:8000. No se publica a internet.
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1200m

  frontend:
    image: ${IMAGEN_FRONTEND:?falta IMAGEN_FRONTEND}
    restart: unless-stopped
    expose:
      - "80"
    mem_limit: 128m

  yellowdata:
    # Imagen del proyecto daalrasi/yellowdata (su pipeline la publica con :latest y el SHA).
    image: ${IMAGEN_YELLOWDATA:-registry.gitlab.com/daalrasi/yellowdata:latest}
    restart: unless-stopped
    environment:
      ASSISTANT_API_URL: "http://api:8000"  # por la red interna: sin salir a internet
    env_file:
      - path: yellowdata.env  # opcional (p. ej. AGENT_EVENTS_TOKEN); nunca en el repositorio
        required: false
    expose:
      - "3000"
    mem_limit: 384m
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: "${DOMINIO}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data  # certificados de Let's Encrypt (no se piden de nuevo en cada deploy)
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
      yellowdata:
        condition: service_started

volumes:
  caddy_datos:
  caddy_config:
